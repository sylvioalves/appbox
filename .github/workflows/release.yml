# Builds the Arch Linux package from packaging/arch on every release
# tag and attaches it to the GitHub release of that tag, creating the
# release when it does not exist yet.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed git github-cli
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build the package
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          useradd -m build
          chown -R build "$GITHUB_WORKSPACE"
          cd packaging/arch
          sudo -u build makepkg -fd --noconfirm
          ls -l appbox-*.pkg.tar.zst
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${GITHUB_REF_NAME}
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
                 --title "Appbox ${tag#v}" --notes "See CHANGELOG.md for the changes in this release."
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber packaging/arch/appbox-*.pkg.tar.zst
